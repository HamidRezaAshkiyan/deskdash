<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif; color: #f4f4f5;
    }
    .card {
      width: 100%; height: 100%; border-radius: 20px;
      background: rgba(15, 17, 26, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .art {
      width: 58px; height: 58px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .meta { flex: 1; min-width: 0; }
    .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 12px; color: #a1a1aa; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .controls { display: flex; gap: 8px; margin-top: 10px; }
    button {
      border: 0; border-radius: 999px; background: rgba(255,255,255,0.1);
      color: #fff; width: 30px; height: 30px; cursor: pointer; font-size: 12px;
      transition: background 0.15s;
    }
    button:hover { background: rgba(255,255,255,0.22); }
    button.primary { background: #6366f1; }
    button.primary:hover { background: #818cf8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="art">♫</div>
    <div class="meta">
      <div id="title" class="title">Nothing Playing</div>
      <div id="artist" class="artist">Start Spotify, YouTube, or any media app</div>
      <div class="controls">
        <button id="prev" title="Previous">⏮</button>
        <button id="play" class="primary" title="Play/Pause">▶</button>
        <button id="next" title="Next">⏭</button>
      </div>
    </div>
  </div>
  <script>
    function render(session) {
      if (!session || !session.title) {
        document.getElementById("title").textContent = "Nothing Playing";
        document.getElementById("artist").textContent = "Idle";
        document.getElementById("play").textContent = "▶";
        return;
      }
      document.getElementById("title").textContent = session.title;
      document.getElementById("artist").textContent = session.artist || session.sourceApp || "";
      document.getElementById("play").textContent = session.isPlaying ? "⏸" : "▶";
    }

    document.getElementById("prev").addEventListener("click", () => dd.media.prev());
    document.getElementById("play").addEventListener("click", async () => {
      await dd.media.playPause();
      render(await dd.media.getSession());
    });
    document.getElementById("next").addEventListener("click", () => dd.media.next());

    dd.media.subscribe(render, 1500);
  </script>
</body>
</html>
