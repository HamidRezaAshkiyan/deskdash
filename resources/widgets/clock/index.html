<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #f4f4f5;
    }
    .card {
      width: 100%; height: 100%;
      border-radius: 20px;
      background: rgba(15, 17, 26, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .time {
      font-size: 46px; font-weight: 700; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .sec { font-size: 20px; font-weight: 500; opacity: 0.7; margin-left: 4px; }
    .date { margin-top: 8px; font-size: 13px; color: rgba(244, 244, 245, 0.72); }
    .jalali { margin-top: 3px; font-size: 12px; color: var(--accent, #818cf8); }
  </style>
</head>
<body>
  <div class="card">
    <div class="time"><span id="hm">00:00</span><span id="sec" class="sec"></span></div>
    <div id="date" class="date"></div>
    <div id="jalali" class="jalali" style="display:none"></div>
  </div>
  <script>
    let cfg = { use24Hour: true, showSeconds: true, showJalali: false, accentColor: "#818cf8" };

    function render() {
      const now = new Date();
      let h = now.getHours();
      let suffix = "";
      if (!cfg.use24Hour) {
        suffix = h >= 12 ? " PM" : " AM";
        h = h % 12 || 12;
      }
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      document.getElementById("hm").textContent = `${String(h).padStart(2, "0")}:${mm}`;
      document.getElementById("sec").textContent = cfg.showSeconds ? `:${ss}${suffix}` : suffix;
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long", month: "short", day: "numeric"
      });
      const jEl = document.getElementById("jalali");
      if (cfg.showJalali) {
        jEl.style.display = "block";
        jEl.style.setProperty("--accent", cfg.accentColor || "#818cf8");
        try {
          jEl.textContent = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
            weekday: "long", year: "numeric", month: "long", day: "numeric"
          }).format(now);
        } catch { jEl.textContent = ""; }
      } else {
        jEl.style.display = "none";
      }
    }

    async function init() {
      try {
        const loaded = await dd.widget.getConfig();
        if (loaded) cfg = { ...cfg, ...loaded };
      } catch {}
      dd.widget.onConfigChange((next) => { cfg = { ...cfg, ...next }; render(); });
      render();
      setInterval(render, 1000);
    }
    init();
  </script>
</body>
</html>
