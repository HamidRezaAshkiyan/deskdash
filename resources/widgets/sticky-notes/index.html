<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif; color: #f4f4f5;
    }
    .card {
      width: 100%; height: 100%; border-radius: 20px;
      background: rgba(24, 24, 32, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .hdr {
      padding: 10px 14px; font-size: 12px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: var(--accent, #fbbf24);
    }
    .status { font-size: 10px; color: #71717a; font-weight: 400; }
    textarea {
      flex: 1; width: 100%; resize: none; border: 0; outline: none;
      background: transparent; color: #e4e4e7;
      padding: 12px 14px; font-size: 13px; line-height: 1.5;
      font-family: inherit;
    }
    textarea::placeholder { color: rgba(161, 161, 170, 0.55); }
  </style>
</head>
<body>
  <div class="card">
    <div id="hdr" class="hdr">
      <span id="title">Quick Notes</span>
      <span id="status" class="status">Saved</span>
    </div>
    <textarea id="editor" placeholder="Write a quick note or checklist..."></textarea>
  </div>
  <script>
    const editor = document.getElementById("editor");
    const statusEl = document.getElementById("status");
    let saveTimer = null;

    function applyConfig(c) {
      if (!c) return;
      if (c.title) document.getElementById("title").textContent = c.title;
      if (c.accentColor) document.getElementById("hdr").style.setProperty("--accent", c.accentColor);
    }

    editor.addEventListener("input", () => {
      statusEl.textContent = "Saving...";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await dd.widget.storage.set("content", editor.value);
          statusEl.textContent = "Saved";
        } catch (err) {
          statusEl.textContent = "Error";
        }
      }, 400);
    });

    async function init() {
      try {
        applyConfig(await dd.widget.getConfig());
        const saved = await dd.widget.storage.get("content");
        if (typeof saved === "string") editor.value = saved;
      } catch {}
      dd.widget.onConfigChange(applyConfig);
    }
    init();
  </script>
</body>
</html>
